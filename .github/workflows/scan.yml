name: Scanare oferte

on:
  schedule:
    # 3 ori pe zi, ora Romaniei ~08:00, ~14:00, ~20:00 (cron e in UTC)
    - cron: "0 5,11,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scaneaza magazinele
        run: python scraper/scrape.py
      - name: Salveaza datele
        run: |
          git config user.name "oferte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualizare oferte $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
