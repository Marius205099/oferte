name: Scanare oferte

on:
  schedule:
    # O data pe zi la 03:00 ora Romaniei. Cron-ul e in UTC, iar Romania e UTC+2 iarna si UTC+3 vara,
    # asa ca pornim la ambele ore si pasul "Verifica ora" o lasa sa ruleze doar pe cea potrivita.
    - cron: "7 1 * * *" # 03:07 iarna (EET); GitHub intarzie des job-urile programate fix la ora exacta
    - cron: "7 0 * * *" # 03:00 vara (EEST)
  workflow_dispatch:
    inputs:
      email_test:
        description: "Trimite si un email de test"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# o singura scanare odata; una noua asteapta sa se termine cea curenta
concurrency:
  group: scan
  cancel-in-progress: false

env:
  # zile in care scanarea programata e sarita (YYYY-MM-DD, ora Romaniei); rularea manuala merge oricand
  SARI_ZILE: "2026-11-16"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verifica ora
        id: ora
        if: github.event_name == 'schedule'
        run: |
          offset=$(TZ=Europe/Bucharest date +%z)
          azi=$(TZ=Europe/Bucharest date +%F)
          run=false
          if [ "${{ github.event.schedule }}" = "7 1 * * *" ] && [ "$offset" = "+0200" ]; then run=true; fi
          if [ "${{ github.event.schedule }}" = "7 0 * * *" ] && [ "$offset" = "+0300" ]; then run=true; fi
          case " $SARI_ZILE " in *" $azi "*) run=false; echo "Scanarea din $azi e sarita.";; esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.ora.outputs.run != 'false'
        uses: actions/checkout@v4
      - if: steps.ora.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.ora.outputs.run != 'false'
        run: pip install -r requirements.txt
      - name: Scaneaza magazinele
        if: steps.ora.outputs.run != 'false'
        run: python scraper/scrape.py
      - name: Salveaza datele
        if: steps.ora.outputs.run != 'false'
        run: |
          git config user.name "oferte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualizare oferte $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - name: Trimite alerta pe email
        if: steps.ora.outputs.run != 'false' && hashFiles('alerta.txt') != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper/notify.py
      - name: Email de test
        if: inputs.email_test
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper/notify.py --test
      # Yahoo pune emailurile trimise de pe adresa ta catre ea insasi doar in "Sent".
      # Un issue care te mentioneaza face GitHub sa-ti trimita email (de la notifications@github.com) in Inbox.
      - name: Alerta pe GitHub
        if: always() && hashFiles('alerta.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@${{ github.repository_owner }}"; echo; tail -n +2 alerta.txt; } > issue.md
          gh issue create --title "$(head -n 1 alerta.txt)" --body-file issue.md
